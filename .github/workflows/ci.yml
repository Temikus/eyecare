name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Install just
        run: brew install just
      - name: Build
        run: just build
      - name: Check
        # The live IOKit suite disables itself when no AppleCLCD2 node exists, as on a CI VM.
        run: just check
